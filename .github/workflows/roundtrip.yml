name: roundtrip-specs

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run roundtrip specs over multi-MB fixtures
        run: bundle exec rspec spec/metanorma/iso_document/roundtrip
